# ChatGPT 5.6 - Keyboard Shortcuts

[personas]
Ctrl+Shift+S = Sol (creative)
Ctrl+Shift+L = Luna (analytical)
Ctrl+Shift+T = Terra (practical)
Ctrl+Shift+C = Cyber (security)
Ctrl+Tab = Cycle personas

[chat]
Ctrl+Enter = Send
Escape = Stop generation
Ctrl+N = New session
Ctrl+B = Branch from message
Ctrl+E = Export

[tools]
Ctrl+M = Voice input
Ctrl+I = Generate image (DALL-E)
Ctrl+Shift+X = Code interpreter

[view]
Ctrl+D = Toggle theme
F11 = Fullscreen
